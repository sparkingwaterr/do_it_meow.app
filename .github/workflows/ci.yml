name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: make build
      - name: Check the app starts far enough to draw its icon
        run: build/PixelCat.app/Contents/MacOS/PixelCat --icon "$RUNNER_TEMP/icon.png" && test -s "$RUNNER_TEMP/icon.png"
